services:
  postgres:
    image: postgres:16-alpine
    container_name: pandasolution-db
    environment:
      POSTGRES_USER: panda
      POSTGRES_PASSWORD: panda
      POSTGRES_DB: pandasolution
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda -d pandasolution"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
